<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Sản Phẩm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Thêm Sản Phẩm Mới</h1>
        
        <div class="success" id="successMsg">✅ Thêm sản phẩm thành công!</div>
        <div class="error" id="errorMsg">❌ Có lỗi xảy ra!</div>

        <form id="productForm">
            <div class="form-group">
                <label>Tên sản phẩm *</label>
                <input type="text" id="title" required placeholder="VD: Classic Hoodie">
            </div>

            <div class="form-group">
                <label>Giá *</label>
                <input type="number" id="price" required placeholder="VD: 69">
            </div>

            <div class="form-group">
                <label>Mô tả</label>
                <textarea id="description" placeholder="Mô tả sản phẩm..."></textarea>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="category" placeholder="VD: Clothes">
            </div>

            <div class="form-group">
                <label>Hình ảnh (URL)</label>
                <input type="text" id="images" placeholder="VD: https://i.imgur.com/example.jpg">
            </div>

            <button type="submit">💾 Thêm Sản Phẩm</button>
        </form>

        <div class="links">
            <a href="/products.html">📋 Xem danh sách sản phẩm</a>
        </div>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const price = parseFloat(document.getElementById('price').value);
            const description = document.getElementById('description').value;
            const category = document.getElementById('category').value;
            const images = document.getElementById('images').value;

            const productData = {
                title: title,
                price: price,
                description: description,
                category: category,
                images: images ? [images] : []
            };

            try {
                const response = await fetch('/api/v1/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    const result = await response.json();
                    showSuccess();
                    document.getElementById('productForm').reset();
                    console.log('Product added:', result);
                } else {
                    showError('Không thể thêm sản phẩm');
                }
            } catch (error) {
                showError('Lỗi: ' + error.message);
            }
        });

        function showSuccess() {
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const successMsg = document.getElementById('successMsg');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '❌ ' + message;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }
    </script>
</body>
</html>
